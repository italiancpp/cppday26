- time: 14:20 - 15:10
  item: "Old-School C++ for the Agentic Age: Lessons from Sane C++ Libraries"
  speaker: 
    - Stefano Cristiano
  abstract: "What happens when an old-school C++ style, developed before the AI wave, turns out to be friendly to agents?<br/>Sane C++ Libraries is a cross-platform open-source project aiming to give C++ a coherent systems-programming base layer. Its independent libraries cover runtime facilities developers expect in ecosystems like JavaScript or Python, from async I/O and files to networking, processes, text, serialization, and HTTP. It is built around explicit constraints: no C++ Standard Library, hidden allocations, exceptions, RTTI, public system headers, or forced framework/build-system adoption.<br/>In an age where code is AI-generated, architecture matters even more. Using the project as a case study, we will focus on fast compile times, allocation-free APIs, lifetime-grouped objects, explicit capacity limits, and library independence, even when that means code duplication or shared private implementation.<br/>The project started before agentic programming was practical, but it's now fully heavily AI focused.<br/>Original principles are now an advantage: small libraries, explicit resource policies, low surprise, tests, and skills make Sane C++ Libraries solid building blocks for your next project."

