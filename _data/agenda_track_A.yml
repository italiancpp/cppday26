- time: 12:00 - 12:50
  item: "Zero-Overhead Dispatches: Leveraging __musttail and Custom ABIs in Modern C++"
  speaker: 
    - Paolo Severini
  abstract: "Interpreters are often assumed to be simple switch-loop engines hindered by heavy dispatch penalties and register spilling. When implementing DrumBrake, the WebAssembly interpreter in V8, we challenged this assumption using modern C++ compiler features and microarchitectural optimizations.<br/>This talk explores how low-level C++ techniques bypass standard ABI overhead to build a high-performance execution pipeline. We dissect how guaranteed tail calls (__musttail) paired with tailored calling conventions (like __vectorcall) eliminate stack frame accumulation and reuse CPU registers across handler transitions, eliminating switch-dispatch penalties while optimizing hardware branch prediction.<br/>Additionally, we will share insights from active experiments with custom calling conventions like __preserve_none, analyzing how altered register preservation impacts register pressure on hot execution paths.<br/>Whether you write runtimes, game engines, or low-latency systems, this session offers a practical deep dive into compiler attributes, generated assembly, and hardware-software co-design in modern C++."

- time: 13:00 - 13:50
  item: "GIS a costo zero: parsing di formati binari in C++23"
  speaker: 
    - Giorgio Bignotti
  abstract: "GeoPackage &egrave; lo standard utilizzato nel GIS per salvare geometrie vettoriali all'interno di SQLite.<br/>Partendo da questo formato, vedremo come affrontare il parsing di dati binari in C++23 eliminando l'overhead di allocazioni dinamiche, copie ed eccezioni. Costruiremo un parser per geometrie WKB (Well-Known Binary) sfruttando std::span per un approccio zero-copy, std::expected per la gestione degli errori e &lt;bit&gt; per gestire in sicurezza endianness e allineamento. Esploreremo inoltre un pattern di decodifica lazy per accedere ai vertici solo quando strettamente necessario.<br/>Analizzeremo il layout binario byte per byte, dimostrando come gli strumenti moderni del linguaggio permettano di implementare una specifica reale in modo molto pi&ugrave; semplice, sicuro e performante rispetto all'approccio classico."

