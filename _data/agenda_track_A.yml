- time: 10:10 - 11:00
  item: "Dal codice legacy ad un registro di algoritmi moderni: rifattorizzazione di centinaia di operazioni di elaborazione delle immagini"
  speaker: 
    - Roberta Cisotti
  abstract: "Molti algoritmi di Computer Vision nascono all'interno di applicazioni monolitiche e, nel corso degli anni, finiscono per essere incapsulati in migliaia di righe di codice strettamente accoppiate al contesto applicativo. Il risultato &egrave; un patrimonio tecnologico prezioso, ma difficile da comprendere, testare, evolvere e riutilizzare.<br/>In questo talk presenter&ograve; un percorso concreto di trasformazione di una grande codebase C++: dall'estrazione di algoritmi di visione da codice legacy fino alla realizzazione di una libreria indipendente, modulare e versionata. Vedremo come individuare e isolare le dipendenze, progettare API stabili, introdurre pratiche di Test-Driven Development, misurare le performance e sfruttare le funzionalit&agrave; del C++ moderno per migliorare qualit&agrave; e manutenibilit&agrave; senza compromettere le prestazioni.<br/>Attraverso un caso reale, analizzeremo le sfide tecniche e organizzative della migrazione da un'architettura monolitica a un ecosistema basato su librerie riutilizzabili, con un approccio graduale che riduce i rischi e massimizza il valore prodotto."

