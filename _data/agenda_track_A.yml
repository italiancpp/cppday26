- time: 07:50 - 08:40
  item: "C++26 Execution Control: un'introduzione"
  speaker: 
    - Alberto Barbati
  abstract: "C++26 introduce la libreria Execution Control: un framework generico per gestire la concorrenza e il parallelismo. Si pone come obbiettivo esplicito di fornire un&rsquo;astrazione che sia espressiva e lungimirante come fu il concetto di iteratore ai tempi della STL. Adottando questa astrazione &egrave; ragionevole pensare ad un futuro ecosistema di librerie, realizzate anche da terze parti, che consentiranno di scrivere codice concorrente sicuro e mantenibile, sfruttando a pieno tutte le potenzialit&agrave; dell&rsquo;hardware, incluse le GPU, in maniera interoperabile, coerente e, soprattutto, efficiente.<br/>L&rsquo;intera libreria, con tutto il suo macchinario di meta-programmazione &egrave; un bersaglio decisamente ostico, che non pu&ograve; essere trattato in breve, ma da qualche parte bisogna pur cominciare! Questa presentazione vuole quindi essere un&rsquo;introduzione ai suoi concetti fondamentali, che consenta gi&agrave; di scrivere programmi concorrenti non banali. Prenderemo confidenza con i Sender e con gli adapter che permettono di comporli per realizzare pipeline asincrone complesse. Vedremo il ruolo degli Scheduler e confronteremo il nuovo approccio con quello tradizionale basato su future e promise. Vedremo anche come la libreria si integra in maniera naturale con le coroutine e come queste possono essere usate per scrivere Sender complessi, ma allo stesso tempo efficienti e semplici da mantenere."

- time: 08:50 - 09:40
  item: "Interesting Allocators in Games"
  speaker: 
    - Sergei Kushnirenko
  abstract: "Every game developer knows the standard advice: avoid new/delete in hot paths, use pools, profile first. But between &quot;I know allocators exist&quot; and &quot;I understand why The Sims used a triple-stack mechanism for NPC AI&quot; lies a surprisingly deep rabbit hole.<br/>This talk is a practical tour through the allocator zoo as it actually lives in production game engines. We start from why the general-purpose allocator is structurally incompatible with game requirements &mdash; not just slow, but architecturally wrong &mdash; and then walk through the full hierarchy: linear and frame allocators, double-buffered variants (and why the GPU pipeline demands them), stack and double-stack designs, memory pools, free-list and segregated allocators, buddy systems, thread-local caches, and even the underappreciated Fibonacci allocator with its surprisingly good fit for natural-language strings."
  language: 🇬🇧 English

- time: 09:40 - 10:10
