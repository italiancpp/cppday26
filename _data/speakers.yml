  description: "Stefano Cristiano has been part of the Italian C++ community since the early Slack days, joining a large portion of its events, sharing his views, experience and opinions of writing C++ since 1998.<br/>He is now directing AI agents to expand Sane C++ Libraries (https://pagghiu.github.io/SaneCppLibraries), a personal open source project developed in his spare time, after many glorious years of carefully writing it line by line.<br/>He is currently a Principal Engineer at NVIDIA, contributing to development of Physical AI as member of the Omniverse Physics team."
